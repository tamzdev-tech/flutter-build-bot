name: Build Flutter APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:

      zip_path:
        description: "Path ZIP di repository"
        required: false
        type: string

      zip_url:
        description: "URL file ZIP project Flutter"
        required: false
        type: string

      app_name:
        description: "Nama aplikasi"
        required: false
        default: "Flutter App"
        type: string

      user_id:
        description: "Telegram User ID"
        required: false
        type: string

      build_type:
        description: "Debug atau Release"
        required: false
        default: "Debug"
        type: string

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # =====================================
      # CHECKOUT
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # SETUP JAVA
      # =====================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"


      # =====================================
      # SETUP FLUTTER
      # =====================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =====================================
      # CHECK FLUTTER
      # =====================================

      - name: Check Flutter Version
        run: |

          flutter --version

          flutter doctor -v


      # =====================================
      # CHECK STORAGE
      # =====================================

      - name: Check Disk Space
        run: |

          echo "================================="
          echo "DISK SPACE"
          echo "================================="

          df -h


      # =====================================
      # DOWNLOAD ZIP
      # =====================================

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          ZIP_PATH: ${{ github.event.inputs.zip_path }}

        run: |

          set -e

          echo "================================="
          echo "DOWNLOAD FLUTTER PROJECT"
          echo "================================="

          rm -f project.zip


          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then

            echo "Downloading ZIP from URL..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              "$ZIP_URL" \
              -o project.zip


          elif [ -n "$ZIP_PATH" ] && [ "$ZIP_PATH" != "null" ]; then

            echo "Using ZIP from repository..."

            if [ ! -f "$ZIP_PATH" ]; then

              echo "ERROR: ZIP tidak ditemukan!"

              exit 1

            fi

            cp "$ZIP_PATH" project.zip


          else

            echo "ERROR: zip_url dan zip_path kosong!"

            exit 1

          fi


          echo ""

          echo "================================="
          echo "ZIP INFORMATION"
          echo "================================="

          ls -lh project.zip


      # =====================================
      # VALIDATE ZIP
      # =====================================

      - name: Validate ZIP
        run: |

          set -e

          echo "================================="
          echo "VALIDATING ZIP"
          echo "================================="

          unzip -t project.zip > /dev/null

          echo "ZIP VALID"


      # =====================================
      # EXTRACT PROJECT
      # =====================================

      - name: Extract Flutter Project
        run: |

          set -e

          echo "================================="
          echo "EXTRACTING PROJECT"
          echo "================================="

          rm -rf my_project

          mkdir -p my_project

          unzip \
            -q \
            project.zip \
            -d my_project


      # =====================================
      # DELETE ZIP
      # =====================================

      - name: Cleanup ZIP
        run: |

          rm -f project.zip

          echo "ZIP berhasil dihapus."


      # =====================================
      # FIND PUBSPEC
      # =====================================

      - name: Find Flutter Project
        run: |

          set -e

          echo "================================="
          echo "SEARCHING PUBSPEC.YAML"
          echo "================================="


          PUBSPEC_FILE=$(find my_project \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)


          if [ -z "$PUBSPEC_FILE" ]; then

            echo "ERROR: pubspec.yaml tidak ditemukan!"

            echo ""

            echo "PROJECT STRUCTURE:"

            find my_project \
              -maxdepth 3 \
              -type f \
              | head -100

            exit 1

          fi


          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")


          echo ""

          echo "FLUTTER PROJECT FOUND:"

          echo "$PROJECT_DIR"


          echo "$PROJECT_DIR" > project_path.txt


      # =====================================
      # SHOW PROJECT
      # =====================================

      - name: Check Project Structure
        run: |

          PROJECT_DIR=$(cat project_path.txt)

          echo "================================="
          echo "FLUTTER PROJECT STRUCTURE"
          echo "================================="

          ls -lah "$PROJECT_DIR"


      # =====================================
      # FLUTTER PUB GET
      # =====================================

      - name: Install Flutter Dependencies
        run: |

          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"


          echo "================================="
          echo "FLUTTER PUB GET"
          echo "================================="


          flutter pub get


      # =====================================
      # CLEAN BUILD
      # =====================================

      - name: Clean Flutter Build
        run: |

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"


          flutter clean


          flutter pub get


      # =====================================
      # BUILD APK
      # =====================================

      - name: Build APK
        env:

          BUILD_TYPE: ${{ github.event.inputs.build_type }}

        run: |

          set -e


          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"


          echo "================================="
          echo "BUILDING FLUTTER APK"
          echo "================================="


          echo "Build Type: $BUILD_TYPE"


          if [ "$BUILD_TYPE" = "Release" ]; then


            echo "Building RELEASE APK..."


            flutter build apk \
              --release


          else


            echo "Building DEBUG APK..."


            flutter build apk \
              --debug


          fi


      # =====================================
      # FIND APK
      # =====================================

      - name: Find APK
        run: |

          set -e


          PROJECT_DIR=$(cat project_path.txt)


          echo "================================="
          echo "SEARCHING APK"
          echo "================================="


          BUILD_TYPE="${{ github.event.inputs.build_type }}"


          if [ "$BUILD_TYPE" = "Release" ]; then


            APK_FILE="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"


          else


            APK_FILE="$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk"


          fi


          if [ ! -f "$APK_FILE" ]; then


            echo "APK default path tidak ditemukan."


            echo ""

            echo "Searching manually..."


            APK_FILE=$(find "$PROJECT_DIR/build" \
              -type f \
              -name "*.apk" \
              -print \
              -quit)


          fi


          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then


            echo "ERROR: APK tidak ditemukan!"


            exit 1

          fi


          echo ""

          echo "APK FOUND:"


          echo "$APK_FILE"


          cp "$APK_FILE" final.apk


          echo ""


          echo "APK SIZE:"


          ls -lh final.apk


          echo "APK_PATH=final.apk" >> $GITHUB_ENV


      # =====================================
      # UPLOAD ARTIFACT
      # =====================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:

          name: flutter-apk-${{ github.run_id }}

          path: final.apk

          if-no-files-found: error

          retention-days: 3


      # =====================================
      # SEND TELEGRAM
      # =====================================

      - name: Send APK to Telegram
        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          CHAT_ID: ${{ github.event.inputs.user_id }}

          APP_NAME: ${{ github.event.inputs.app_name }}

          BUILD_TYPE: ${{ github.event.inputs.build_type }}

        run: |

          set -e


          echo "================================="
          echo "SEND APK TO TELEGRAM"
          echo "================================="


          if [ ! -f "final.apk" ]; then

            echo "ERROR: final.apk tidak ditemukan!"

            exit 1

          fi


          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then

            echo "ERROR: TELEGRAM_BOT_TOKEN kosong!"

            exit 1

          fi


          if [ -z "$CHAT_ID" ]; then

            echo "ERROR: Telegram User ID kosong!"

            exit 1

          fi


          APK_SIZE=$(du -h final.apk | cut -f1)


          CAPTION="✅ Build ${BUILD_TYPE} Berhasil!

📱 Project: ${APP_NAME}
📦 Size: ${APK_SIZE}"


          echo "Mengirim APK ke Telegram..."


          curl \
            --fail \
            --retry 3 \
            --max-time 0 \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@final.apk" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"


          echo ""

          echo "================================="
          echo "APK BERHASIL DIKIRIM"
          echo "=================================="


      # =====================================
      # FINAL STORAGE CHECK
      # =====================================

      - name: Final Disk Check
        if: always()

        run: |

          echo "================================="
          echo "FINAL DISK SPACE"
          echo "================================="

          df -h
