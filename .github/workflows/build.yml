name: Build Android APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:

      zip_path:
        description: "Path ZIP di repository"
        required: false
        type: string

      zip_url:
        description: "URL file ZIP project"
        required: false
        type: string

      app_name:
        description: "Nama aplikasi"
        required: false
        default: "Android App"
        type: string

      user_id:
        description: "Telegram User ID"
        required: false
        type: string

      build_type:
        description: "Debug atau Release"
        required: false
        default: "Debug"
        type: string

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # =====================================
      # CHECKOUT
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # JAVA 17
      # =====================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"


      # =====================================
      # CEK STORAGE
      # =====================================

      - name: Check Disk Space
        run: |

          echo "================================="
          echo "DISK SPACE"
          echo "================================="

          df -h


      # =====================================
      # DOWNLOAD ZIP
      # =====================================

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          ZIP_PATH: ${{ github.event.inputs.zip_path }}

        run: |

          set -e

          echo "================================="
          echo "DOWNLOAD PROJECT"
          echo "================================="

          rm -f project.zip

          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then

            echo "Downloading ZIP from URL..."
            echo "URL: $ZIP_URL"

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 0 \
              "$ZIP_URL" \
              -o project.zip

          elif [ -n "$ZIP_PATH" ] && [ "$ZIP_PATH" != "null" ]; then

            echo "Using ZIP from repository..."

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: ZIP_PATH tidak ditemukan!"
              exit 1
            fi

            cp "$ZIP_PATH" project.zip

          else

            echo "ERROR: zip_url dan zip_path kosong!"
            exit 1

          fi


          echo ""
          echo "================================="
          echo "ZIP INFORMATION"
          echo "================================="

          ls -lh project.zip

          echo ""

          FILE_SIZE=$(du -h project.zip | cut -f1)

          echo "ZIP SIZE: $FILE_SIZE"


      # =====================================
      # VALIDASI ZIP
      # =====================================

      - name: Validate ZIP
        run: |

          set -e

          echo "================================="
          echo "VALIDATING ZIP"
          echo "================================="

          unzip -t project.zip > /dev/null

          echo "ZIP VALID"


      # =====================================
      # EXTRACT PROJECT
      # =====================================

      - name: Extract Project
        run: |

          set -e

          echo "================================="
          echo "EXTRACTING PROJECT"
          echo "================================="

          rm -rf my_project

          mkdir -p my_project

          unzip \
            -q \
            project.zip \
            -d my_project


      # =====================================
      # HAPUS ZIP AGAR HEMAT STORAGE
      # =====================================

      - name: Cleanup ZIP
        run: |

          rm -f project.zip

          echo "ZIP berhasil dihapus."


      # =====================================
      # CARI PROJECT GRADLE
      # =====================================

      - name: Find Android Gradle Project
        run: |

          set -e

          echo "================================="
          echo "SEARCHING ANDROID PROJECT"
          echo "================================="

          PROJECT_FILE=$(find my_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)


          if [ -z "$PROJECT_FILE" ]; then

            echo "ERROR: Android Gradle project tidak ditemukan!"

            echo ""
            echo "Mencari pubspec.yaml..."

            find my_project \
              -type f \
              -name "pubspec.yaml"

            exit 1

          fi


          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo ""
          echo "PROJECT DIR:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt


      # =====================================
      # TAMPILKAN STRUKTUR
      # =====================================

      - name: Check Project Structure
        run: |

          PROJECT_DIR=$(cat project_path.txt)

          echo "================================="
          echo "PROJECT STRUCTURE"
          echo "================================="

          ls -lah "$PROJECT_DIR"

          echo ""

          if [ -d "$PROJECT_DIR/app" ]; then

            echo "APP FOLDER:"
            ls -lah "$PROJECT_DIR/app"

          fi


      # =====================================
      # SETUP GRADLE
      # =====================================

      - name: Setup Gradle
        run: |

          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo "================================="
          echo "SETUP GRADLE"
          echo "================================="

          if [ ! -f "./gradlew" ]; then

            echo "ERROR: gradlew tidak ditemukan!"

            exit 1

          fi

          chmod +x gradlew


      # =====================================
      # CEK VERSI GRADLE
      # =====================================

      - name: Check Gradle Version
        run: |

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          ./gradlew --version


      # =====================================
      # GRADLE CACHE
      # =====================================

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:

          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

          key: gradle-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            gradle-${{ runner.os }}-


      # =====================================
      # CEK STORAGE SEBELUM BUILD
      # =====================================

      - name: Check Disk Before Build
        run: |

          echo "================================="
          echo "DISK BEFORE BUILD"
          echo "================================="

          df -h


      # =====================================
      # BUILD APK
      # =====================================

      - name: Build APK
        env:

          BUILD_TYPE: ${{ github.event.inputs.build_type }}

          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx6g
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.workers.max=4

        run: |

          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo "================================="
          echo "BUILD APK"
          echo "================================="

          echo "BUILD TYPE: $BUILD_TYPE"

          ./gradlew clean


          if [ "$BUILD_TYPE" = "Release" ]; then

            echo ""
            echo "BUILDING RELEASE APK..."

            ./gradlew \
              assembleRelease \
              --stacktrace \
              --no-daemon

          else

            echo ""
            echo "BUILDING DEBUG APK..."

            ./gradlew \
              assembleDebug \
              --stacktrace \
              --no-daemon

          fi


      # =====================================
      # CARI APK
      # =====================================

      - name: Find APK
        run: |

          set -e

          echo "================================="
          echo "SEARCHING APK"
          echo "================================="

          echo ""

          find my_project \
            -type f \
            -name "*.apk" \
            -print


          BUILD_TYPE="${{ github.event.inputs.build_type }}"


          if [ "$BUILD_TYPE" = "Release" ]; then

            APK_FILE=$(find my_project \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit)

          else

            APK_FILE=$(find my_project \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit)

          fi


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK tidak ditemukan!"

            exit 1

          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"


          cp "$APK_FILE" final.apk


          echo ""

          echo "APK SIZE:"

          ls -lh final.apk


          echo "APK_PATH=final.apk" >> $GITHUB_ENV


      # =====================================
      # UPLOAD ARTIFACT
      # =====================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:

          name: android-apk-${{ github.run_id }}

          path: final.apk

          if-no-files-found: error

          retention-days: 3


      # =====================================
      # SEND APK TELEGRAM
      # =====================================

      - name: Send APK to Telegram
        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          CHAT_ID: ${{ github.event.inputs.user_id }}

          APP_NAME: ${{ github.event.inputs.app_name }}

          BUILD_TYPE: ${{ github.event.inputs.build_type }}

        run: |

          set -e

          echo "================================="
          echo "SEND APK TO TELEGRAM"
          echo "================================="


          if [ ! -f "final.apk" ]; then

            echo "ERROR: final.apk tidak ditemukan!"

            exit 1

          fi


          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then

            echo "ERROR: TELEGRAM_BOT_TOKEN kosong!"

            exit 1

          fi


          if [ -z "$CHAT_ID" ]; then

            echo "ERROR: Telegram User ID kosong!"

            exit 1

          fi


          APK_SIZE=$(du -h final.apk | cut -f1)


          CAPTION="✅ Build ${BUILD_TYPE} Berhasil!

📱 Project: ${APP_NAME}
📦 Size: ${APK_SIZE}"


          echo "Mengirim APK..."


          curl \
            --fail \
            --retry 3 \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@final.apk" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"


          echo ""

          echo "================================="
          echo "APK BERHASIL DIKIRIM"
          echo "================================="


      # =====================================
      # STORAGE INFO
      # =====================================

      - name: Final Disk Check
        if: always()

        run: |

          echo "================================="
          echo "FINAL DISK SPACE"
          echo "================================="

          df -h
